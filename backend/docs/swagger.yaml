          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceGetDeviceResponse'
      security:
      - Bearer: []
      summary: 通过 ID 获取设备
      tags:
      - 设备模块
    put:
      consumes:
      - application/json
      description: 通过设备 ID 更新设备
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DeviceUpdateDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceUpdateDeviceResponse'
      security:
      - Bearer: []
      summary: 更新设备
      tags:
      - 设备模块
  /devices/{id}/activate:
    post:
      consumes:
      - application/json
      description: 通过设备 ID 激活设备
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceActivateDeviceResponse'
      security:
      - Bearer: []
      summary: 激活设备
      tags:
      - 设备模块
  /devices/{id}/enabled:
    post:
      consumes:
      - application/json
      description: 通过设备 ID 启用或禁用设备
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DeviceSetDeviceEnabledRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceSetDeviceEnabledResponse'
      security:
      - Bearer: []
      summary: 设置设备启用/禁用
      tags:
      - 设备模块
  /devices/{id}/push-records:
    delete:
      consumes:
      - application/json
      description: 清理设备指定时间戳之前的下行推送记录
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
