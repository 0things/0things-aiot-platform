        in: query
        name: beforeTimestamp
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceClearPushRecordsResponse'
      security:
      - Bearer: []
      summary: 清理设备下行推送记录
      tags:
      - 设备模块
    get:
      consumes:
      - application/json
      description: 分页获取设备的下行推送记录
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 操作类型
        in: query
        name: operationType
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceListPushRecordsResponse'
      security:
      - Bearer: []
      summary: 获取设备下行推送记录列表
      tags:
      - 设备模块
  /devices/{id}/restore:
    post:
      consumes:
      - application/json
      description: 通过设备 ID 恢复软删除的设备
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceRestoreDeviceResponse'
      security:
      - Bearer: []
      summary: 恢复已删除的设备
      tags:
      - 设备模块
  /devices/{id}/shadow:
    get:
      consumes:
      - application/json
      description: 获取设备影子（Desired、Reported、Delta、Metadata、Version）
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceShadow'
      security:
      - Bearer: []
      summary: 获取设备影子
      tags:
      - 设备模块
  /devices/{id}/shadow/desired:
    delete:
      consumes:
      - application/json
      description: 清空设备影子的 Desired 部分
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DeviceClearDesiredShadowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceShadow'
      security:
      - Bearer: []
      summary: 清空设备影子期望值
      tags:
      - 设备模块
    put:
      consumes:
      - application/json
      description: 由应用侧更新设备的 Desired 影子
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DeviceUpdateDesiredShadowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceShadow'
      security:
      - Bearer: []
      summary: 更新设备影子期望值
      tags:
      - 设备模块
  /devices/{id}/shadow/history:
    get:
      consumes:
      - application/json
      description: 获取设备影子的变更历史记录
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceListDeviceShadowHistoryResponse'
      security:
      - Bearer: []
      summary: 获取设备影子历史
