host: localhost:8000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server celler server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Nunu Example API
  version: 1.0.0
paths:
  /device-events:
    get:
      description: 分页获取物模型设备事件，支持关键词、设备、事件类型与时间范围筛选
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 关键词
        in: query
        name: keyword
        type: string
      - description: 设备 Key
        in: query
        name: device_key
        type: string
      - description: 事件类型
        in: query
        name: event_type
        type: string
      - description: 开始时间 RFC3339
        in: query
        name: start_at
        type: string
      - description: 结束时间 RFC3339
        in: query
        name: end_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceEventListDeviceEventsResponse'
      security:
      - Bearer: []
      summary: 获取设备事件列表
      tags:
      - 事件管理
  /device-statistics:
    get:
      consumes:
      - application/json
      description: 获取设备统计信息（总数、已激活、在线、离线、未激活）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceStatisticsResponse'
      security:
      - Bearer: []
      summary: 设备统计
      tags:
      - 设备模块
  /devices:
    get:
      consumes:
      - application/json
      description: 分页获取设备列表，支持按 productId、states、enabled、searchText 过滤
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 产品 ID
        in: query
        name: productId
        type: integer
      - collectionFormat: csv
        description: 设备状态
        in: query
        items:
          type: string
        name: states
        type: array
      - description: 是否启用
        in: query
        name: enabled
        type: boolean
      - description: 搜索关键字
        in: query
        name: searchText
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceListDevicesResponse'
      security:
      - Bearer: []
      summary: 获取设备列表
      tags:
      - 设备模块
    post:
      consumes:
      - application/json
      description: 创建一个新的设备
      parameters:
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DeviceCreateDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceCreateDeviceResponse'
      security:
      - Bearer: []
      summary: 创建设备
      tags:
      - 设备模块
  /devices/{device_key}/mqtt-parameters:
    get:
      consumes:
      - application/json
      description: 获取设备 MQTT 连接的 ClientID、Username、Password、HostURL、Port
      parameters:
      - description: 设备 DeviceKey
        in: path
        name: device_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceMQTTParametersResponse'
      security:
      - Bearer: []
      summary: 获取 MQTT 连接参数
      tags:
      - 设备模块
  /devices/{id}:
    delete:
      consumes:
      - application/json
      description: 通过设备 ID 软删除设备
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceSuccessResponse'
      security:
      - Bearer: []
      summary: 删除设备
      tags:
      - 设备模块
    get:
      consumes:
      - application/json
      description: 通过设备 ID 获取设备详情
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
