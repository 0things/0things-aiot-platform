      - 设备模块
  /devices/{id}/shadow/reported:
    put:
      consumes:
      - application/json
      description: 由设备侧更新 Reported 影子
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DeviceUpdateReportedShadowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceShadow'
      security:
      - Bearer: []
      summary: 更新设备影子上报值
      tags:
      - 设备模块
  /devices/{id}/simulate-push:
    post:
      consumes:
      - application/json
      description: 模拟服务端向设备发起一次下行推送
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DeviceSimulatePushRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ApiResponse-DeviceSimulatePushResponse'
      security:
      - Bearer: []
      summary: 模拟下行推送
      tags:
      - 设备模块
  /devices/{id}/tags:
    delete:
      consumes:
      - application/json
      description: 删除设备指定的标签键
      parameters:
      - description: 设备 ID
        in: path
        name: id
        required: true
        type: integer
      - description: params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/DeviceDeleteDeviceTagsRequest'
      produces:
      - application/json
      responses:
