env: local
http:
  host: 127.0.0.1
  port: 8000
security:
  api_sign:
    app_key: change-me
    app_security: change-me
  jwt:
    key: change-me-to-a-random-secret
  # 端点凭据加密密钥；生产环境必须使用独立随机值。
  device_credentials_key: change-me-to-a-random-device-credentials-key
data:
  db:
    aiot:
      driver: sqlite
      dsn: storage/aiot-device.db
  storage:
    r2:
      endpoint: "https://<account-id>.r2.cloudflarestorage.com"
      bucket: ""
      region: "auto"
      access_key_id: ""
      secret_access_key: ""
      public_base_url: ""
      prefix: "ota"
  redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 0
    read_timeout: 0.2s
    write_timeout: 0.2s
  kafka:
    device:
      # Used by the mock endpoint and the iotEvent consumer.
      brokers: []
  mqtt:
    # OTA 传输开发使用的本地 MQTT Broker 示例配置。
    broker: tcp://127.0.0.1:1883
    client_id: aiot-ota-backend
    username: ""
    password: ""
# ==============================================================================
# 统一时序数据库配置 (可插拔时序存储引擎，用于 /telemetry/history 历史曲线查询)
# 切换数据库只需修改 `type` 字段 (tdengine | sqlite | postgresql | timescaledb | clickhouse | influxdb | iotdb | mock)
# ==============================================================================
tsdb:
log:
  log_level: debug
  mode: console
  encoding: console
  log_file_name: "./storage/logs/backend.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
