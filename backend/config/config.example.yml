env: local
http:
  host: 127.0.0.1
  port: 8000
security:
  api_sign:
    app_key: change-me
    app_security: change-me
  jwt:
    key: change-me-to-a-random-secret
  # 端点凭据加密密钥；生产环境必须使用独立随机值。
  device_credentials_key: change-me-to-a-random-device-credentials-key
data:
  db:
    user:
      driver: sqlite
      dsn: storage/nunu-test.db
    device:
      driver: postgres
      dsn: host=127.0.0.1 port=5432 user=postgres dbname=device_service sslmode=disable
  storage:
    r2:
      endpoint: "https://<account-id>.r2.cloudflarestorage.com"
      bucket: ""
      region: "auto"
      access_key_id: ""
      secret_access_key: ""
      public_base_url: ""
      prefix: "ota"
  redis:
    addr: 127.0.0.1:6350
    password: ""
    db: 0
    read_timeout: 0.2s
    write_timeout: 0.2s
    device:
      addr: 127.0.0.1:6379
      password: ""
      db: 0
  kafka:
    device:
      # Used by the mock endpoint and the iotEvent consumer.
      brokers: []
  mqtt:
    # OTA 传输开发使用的本地 MQTT Broker 示例配置。
    broker: tcp://127.0.0.1:1883
    client_id: aiot-ota-backend
    username: ""
    password: ""
device_gateway:
  # 独立设备协议网关的 HTTP 上报监听地址。
  http_addr: :8081
  # 可选 TCP 设备接入监听地址，留空时不启动 TCP Listener。
  tcp_addr: ""
  # 可选 CoAP/UDP 监听地址，留空时不启动 CoAP Listener。
  coap_addr: ""
  # 与管理服务共用的 OTA Kafka 消费组，保证命令只被一个进程处理。
  kafka_consumer_group: aiot-backend-ota-commands
  # 端点超过该时长未上报时自动标记为 offline。
  endpoint_offline_after: 5m
  mqtt:
    # MQTT 设备属性上报主题，第二、第三通配段分别为 productKey 和 deviceName。
    broker: tcp://127.0.0.1:1883
    ingress_topic: /sys/+/+/thing/event/property/post
    username: ""
    password: ""
  mongo:
    uri: mongodb://username:password@localhost:27017
log:
  log_level: debug
  mode: console
  encoding: console
  log_file_name: "./storage/logs/server.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
