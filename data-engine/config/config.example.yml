env: local

kafka:
  brokers:
    - "127.0.0.1:9092"
  telemetry_consumer_group: "data-engine-telemetry-consumer-group"
  ota_consumer_group: "data-engine-ota-consumer-group"
  event_consumer_group: "data-engine-event-consumer-group"

# TDengine 时序数据库连接配置 (可选配置，未配置时自动使用 Mock/内存模式)
tdengine:
  dsn: "" # eg: "root:taosdata@ws(127.0.0.1:6041)/things_tsdb"
  database: "things_tsdb"

# Redis 设备影子连接配置
redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

log:
  log_level: debug
  mode: console
  encoding: console
  log_file_name: "./storage/logs/data-engine.log"
  max_backups: 30
  max_age: 7
  max_size: 1024
  compress: true
