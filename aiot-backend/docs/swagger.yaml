info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server celler server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Nunu Example API
  version: 1.0.0
paths:
  /alerts:
    get:
      consumes:
      - application/json
      description: 分页获取告警列表，支持按 status、severity、device_key 过滤
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 状态
        in: query
        name: status
        type: string
      - description: 严重程度
        in: query
        name: severity
        type: string
      - description: 设备 Key
        in: query
        name: device_key
        type: string
