host: localhost:8000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server celler server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Nunu Example API
  version: 1.0.0
paths:
  /alerts:
    get:
      consumes:
      - application/json
      description: 分页获取告警列表，支持按 status、severity、device_key 过滤
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 状态
        in: query
        name: status
        type: string
      - description: 严重程度
        in: query
        name: severity
        type: string
      - description: 设备 Key
        in: query
        name: device_key
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AlertListAlertsResponse'
      security:
      - Bearer: []
      summary: 获取告警列表
      tags:
      - 告警模块
  /alerts/{id}:
    get:
      consumes:
      - application/json
      description: 通过告警 ID 获取告警详情
      parameters:
      - description: 告警 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AlertGetAlertResponse'
      security:
      - Bearer: []
      summary: 获取告警详情
      tags:
      - 告警模块
  /alerts/{id}/ack:
    post:
      consumes:
      - application/json
      description: 通过告警 ID 确认（acknowledged）该告警
      parameters:
      - description: 告警 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AlertGetAlertResponse'
      security:
      - Bearer: []
      summary: 确认告警
      tags:
      - 告警模块
  /alerts/{id}/resolve:
    post:
      consumes:
      - application/json
      description: 通过告警 ID 处理（resolved）该告警
      parameters:
      - description: 告警 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AlertGetAlertResponse'
      security:
      - Bearer: []
      summary: 处理告警
      tags:
      - 告警模块
  /device-events:
    get:
      description: 分页获取物模型设备事件，支持关键词、设备、事件类型与时间范围筛选
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 关键词
        in: query
        name: keyword
        type: string
      - description: 设备 Key
        in: query
        name: device_key
        type: string
      - description: 事件类型
        in: query
        name: event_type
        type: string
      - description: 开始时间 RFC3339
        in: query
        name: start_at
        type: string
      - description: 结束时间 RFC3339
        in: query
        name: end_at
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DeviceEventListDeviceEventsResponse'
      security:
      - Bearer: []
      summary: 获取设备事件列表
      tags:
      - 事件管理
  /device-statistics:
    get:
      consumes:
      - application/json
      description: 获取设备统计信息（总数、已激活、在线、离线、未激活）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DeviceStatisticsResponse'
      security:
      - Bearer: []
