{{- if .Values.transportHttp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "transport-http") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "transport-http") | nindent 4 }}
spec:
  replicas: {{ .Values.transportHttp.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "0things.selectorLabels" (dict "root" . "component" "transport-http") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "0things.selectorLabels" (dict "root" . "component" "transport-http") | nindent 8 }}
      annotations:
        checksum/config: {{ toJson (dict "auth" .Values.transportHttp.auth "nats" .Values.nats.auth "environment" .Values.global.environment) | sha256sum }}
    spec:
      {{- include "0things.imagePullSecrets" . | nindent 6 }}
      {{- include "0things.podSecurityContext" . | nindent 6 }}
      containers:
        - name: transport-http
          image: "{{ .Values.transportHttp.image.repository }}:{{ .Values.transportHttp.image.tag }}"
          imagePullPolicy: {{ .Values.transportHttp.image.pullPolicy }}
          {{- include "0things.containerSecurityContext" . | nindent 10 }}
          env:
            - name: APP_CONF
              value: config/helm.yml
          ports:
            - name: http
              containerPort: {{ .Values.transportHttp.service.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.transportHttp.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /data/app/config/helm.yml
              subPath: helm.yml
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: {{ default (include "0things.componentName" (dict "root" . "component" "transport-http-config")) .Values.transportHttp.existingConfigSecret }}
---
{{- end }}
