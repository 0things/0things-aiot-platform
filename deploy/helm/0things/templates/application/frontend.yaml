{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "0things.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "0things.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
      annotations:
        checksum/config: {{ toJson (dict "backend" .Values.backend.enabled "mcp" .Values.mcpServer.enabled "ai" .Values.aiCopilot.enabled) | sha256sum }}
    spec:
      {{- include "0things.imagePullSecrets" . | nindent 6 }}
      {{- include "0things.podSecurityContext" . | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "0things.componentName" (dict "root" . "component" "frontend") }}
{{- end }}
