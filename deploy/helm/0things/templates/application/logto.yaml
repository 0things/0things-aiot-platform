{{- if and .Values.logto.enabled (not .Values.logtoPostgres.enabled) }}
{{- fail "logto.enabled requires logtoPostgres.enabled" }}
{{- end }}
{{- if .Values.logto.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: logto
  labels:
    {{- include "0things.labels" "logto" | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ printf "postgres://%s:%s@%s:%d/%s" (.Values.logtoPostgres.auth.username | urlquery) (.Values.logtoPostgres.auth.password | urlquery) "logto-postgres" (int .Values.logtoPostgres.service.port) (.Values.logtoPostgres.auth.database | urlquery) | quote }}
  ENDPOINT: {{ .Values.global.publicUrls.logto | quote }}
  ADMIN_ENDPOINT: {{ .Values.global.publicUrls.logtoAdmin | quote }}
---
{{- end }}
{{- if .Values.logto.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto
  labels:
    {{- include "0things.labels" "logto" | nindent 4 }}
spec:
  replicas: {{ .Values.logto.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "0things.labels" "logto" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "0things.labels" "logto" | nindent 8 }}
    spec:
      {{- include "0things.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: logto
          image: "{{ .Values.logto.image.repository }}:{{ .Values.logto.image.tag }}"
          imagePullPolicy: {{ .Values.logto.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - npm run cli db seed -- --swe && exec npm start
          envFrom:
            - secretRef:
                name: logto
          env:
            - name: TRUST_PROXY_HEADER
              value: "1"
          ports:
            - name: app
              containerPort: {{ .Values.logto.service.appPort }}
            - name: admin
              containerPort: {{ .Values.logto.service.adminPort }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: app
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/status
              port: app
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            {{- toYaml .Values.logto.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: logto
  labels:
    {{- include "0things.labels" "logto" | nindent 4 }}
spec:
  type: {{ .Values.logto.service.type }}
  ports:
    - name: app
      port: {{ .Values.logto.service.appPort }}
      targetPort: {{ .Values.logto.service.appPort }}
    - name: admin
      port: {{ .Values.logto.service.adminPort }}
      targetPort: {{ .Values.logto.service.adminPort }}
  selector:
    {{- include "0things.labels" "logto" | nindent 4 }}
{{- end }}
