{{- if and .Values.aiCopilot.enabled (not .Values.mcpServer.enabled) }}
{{- fail "aiCopilot.enabled requires mcpServer.enabled" }}
{{- end }}
{{- if .Values.aiCopilot.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: ai-copilot
  labels:
    {{- include "0things.labels" "ai-copilot" | nindent 4 }}
type: Opaque
stringData:
  AI_MODEL_BASE_URL: {{ required "aiCopilot.config.modelBaseUrl is required" .Values.aiCopilot.config.modelBaseUrl | quote }}
  AI_MODEL_API_KEY: {{ required "aiCopilot.config.modelApiKey is required" .Values.aiCopilot.config.modelApiKey | quote }}
  AI_MODEL_ID: {{ required "aiCopilot.config.modelId is required" .Values.aiCopilot.config.modelId | quote }}
---
{{- end }}
{{- if .Values.aiCopilot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-copilot
  labels:
    {{- include "0things.labels" "ai-copilot" | nindent 4 }}
spec:
  replicas: {{ .Values.aiCopilot.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "0things.labels" "ai-copilot" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "0things.labels" "ai-copilot" | nindent 8 }}
    spec:
      {{- include "0things.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-copilot
          image: "{{ .Values.aiCopilot.image.repository }}:{{ .Values.aiCopilot.image.tag }}"
          imagePullPolicy: {{ .Values.aiCopilot.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: ai-copilot
          env:
            - name: AI_GATEWAY_PORT
              value: {{ .Values.aiCopilot.service.port | quote }}
            - name: AI_GATEWAY_HOST
              value: 0.0.0.0
            - name: MCP_STREAMABLE_HTTP_URL
              value: {{ printf "http://%s:%d/mcp" "mcp-server" (int .Values.mcpServer.service.port) | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.aiCopilot.service.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.aiCopilot.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-copilot
  labels:
    {{- include "0things.labels" "ai-copilot" | nindent 4 }}
spec:
  type: {{ .Values.aiCopilot.service.type }}
  ports:
    - name: http
      port: {{ .Values.aiCopilot.service.port }}
      targetPort: {{ .Values.aiCopilot.service.port }}
  selector:
    {{- include "0things.labels" "ai-copilot" | nindent 4 }}
{{- end }}
