{{- if .Values.emqx.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: emqx
  labels:
    {{- include "0things.labels" "emqx" | nindent 4 }}
type: Opaque
stringData:
  EMQX_DASHBOARD__DEFAULT_USERNAME: {{ required "emqx.dashboard.username is required" .Values.emqx.dashboard.username | quote }}
  EMQX_DASHBOARD__DEFAULT_PASSWORD: {{ required "emqx.dashboard.password is required" .Values.emqx.dashboard.password | quote }}
---
{{- end }}
{{- if .Values.emqx.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  labels:
    {{- include "0things.labels" "emqx" | nindent 4 }}
spec:
  replicas: 1
  serviceName: emqx
  selector:
    matchLabels:
      {{- include "0things.labels" "emqx" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "0things.labels" "emqx" | nindent 8 }}
    spec:
      {{- include "0things.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: emqx
          image: "{{ .Values.emqx.image.repository }}:{{ .Values.emqx.image.tag }}"
          imagePullPolicy: {{ .Values.emqx.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: emqx
          ports:
            - name: mqtt
              containerPort: {{ .Values.emqx.service.mqttPort }}
            - name: websocket
              containerPort: {{ .Values.emqx.service.websocketPort }}
            - name: dashboard
              containerPort: {{ .Values.emqx.service.dashboardPort }}
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/opt/emqx/bin/emqx", "ctl", "status"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.emqx.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/emqx/data
      {{- if not .Values.emqx.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.emqx.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.emqx.persistence.accessModes | nindent 10 }}
        {{- include "0things.storageClass" (dict "storageClass" (default .Values.global.storageClass .Values.emqx.persistence.storageClass)) | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.emqx.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
  labels:
    {{- include "0things.labels" "emqx" | nindent 4 }}
spec:
  type: {{ .Values.emqx.service.type }}
  ports:
    - name: mqtt
      port: {{ .Values.emqx.service.mqttPort }}
      targetPort: {{ .Values.emqx.service.mqttPort }}
    - name: websocket
      port: {{ .Values.emqx.service.websocketPort }}
      targetPort: {{ .Values.emqx.service.websocketPort }}
    - name: dashboard
      port: {{ .Values.emqx.service.dashboardPort }}
      targetPort: {{ .Values.emqx.service.dashboardPort }}
  selector:
    {{- include "0things.labels" "emqx" | nindent 4 }}
---
{{- end }}
