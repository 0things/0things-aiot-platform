{{- if and .Values.nats.enabled .Values.nats.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: nats
  labels:
    {{- include "0things.labels" "nats" | nindent 4 }}
type: Opaque
stringData:
  NATS_USERNAME: {{ required "nats.auth.username is required when NATS authentication is enabled" .Values.nats.auth.username | quote }}
  NATS_PASSWORD: {{ required "nats.auth.password is required when NATS authentication is enabled" .Values.nats.auth.password | quote }}
---
{{- end }}
{{- if .Values.nats.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    {{- include "0things.labels" "nats" | nindent 4 }}
spec:
  replicas: 1
  serviceName: nats
  selector:
    matchLabels:
      {{- include "0things.labels" "nats" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "0things.labels" "nats" | nindent 8 }}
    spec:
      {{- include "0things.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          {{- if .Values.nats.auth.enabled }}
          envFrom:
            - secretRef:
                name: nats
          command: ["sh", "-c"]
          args:
            - exec nats-server -js -sd /data -m {{ .Values.nats.service.monitorPort }} --user "$NATS_USERNAME" --pass "$NATS_PASSWORD"
          {{- else }}
          args: ["-js", "-sd", "/data", "-m", {{ .Values.nats.service.monitorPort | quote }}]
          {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.nats.service.clientPort }}
            - name: monitor
              containerPort: {{ .Values.nats.service.monitorPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.nats.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.nats.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.nats.persistence.accessModes | nindent 10 }}
        {{- include "0things.storageClass" (dict "storageClass" (default .Values.global.storageClass .Values.nats.persistence.storageClass)) | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    {{- include "0things.labels" "nats" | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.nats.service.clientPort }}
      targetPort: {{ .Values.nats.service.clientPort }}
    - name: monitor
      port: {{ .Values.nats.service.monitorPort }}
      targetPort: {{ .Values.nats.service.monitorPort }}
  selector:
    {{- include "0things.labels" "nats" | nindent 4 }}
---
{{- end }}
