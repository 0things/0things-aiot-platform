{{- if .Values.registry.create }}
{{- $registryUsername := required "registry.username is required when registry.create is true" .Values.registry.username -}}
{{- $registryPassword := required "registry.password is required when registry.create is true" .Values.registry.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.registrySecretName" . }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "registry") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":%s,\"password\":%s,\"email\":%s,\"auth\":%s}}}" .Values.registry.server ($registryUsername | toJson) ($registryPassword | toJson) (.Values.registry.email | toJson) (printf "%s:%s" $registryUsername $registryPassword | b64enc | toJson) | b64enc | quote }}
---
{{- end }}
{{- if and .Values.postgres.enabled .Values.postgres.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "postgres.auth.username is required" .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.auth.password is required" .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ required "postgres.auth.database is required" .Values.postgres.auth.database | quote }}
---
{{- end }}
{{- if and .Values.logtoPostgres.enabled .Values.logtoPostgres.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "logto-postgres") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "logto-postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "logtoPostgres.auth.username is required" .Values.logtoPostgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "logtoPostgres.auth.password is required" .Values.logtoPostgres.auth.password | quote }}
  POSTGRES_DB: {{ required "logtoPostgres.auth.database is required" .Values.logtoPostgres.auth.database | quote }}
---
{{- end }}
{{- if and .Values.redis.enabled .Values.redis.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "redis") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "redis") | nindent 4 }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
---
{{- end }}
{{- if and .Values.nats.enabled .Values.nats.auth.enabled .Values.nats.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "nats") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "nats") | nindent 4 }}
type: Opaque
stringData:
  NATS_USERNAME: {{ required "nats.auth.username is required when NATS authentication is enabled" .Values.nats.auth.username | quote }}
  NATS_PASSWORD: {{ required "nats.auth.password is required when NATS authentication is enabled" .Values.nats.auth.password | quote }}
---
{{- end }}
{{- if and .Values.emqx.enabled .Values.emqx.dashboard.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "emqx") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "emqx") | nindent 4 }}
type: Opaque
stringData:
  EMQX_DASHBOARD__DEFAULT_USERNAME: {{ required "emqx.dashboard.username is required" .Values.emqx.dashboard.username | quote }}
  EMQX_DASHBOARD__DEFAULT_PASSWORD: {{ required "emqx.dashboard.password is required" .Values.emqx.dashboard.password | quote }}
---
{{- end }}
{{- if and .Values.tdengine.enabled .Values.tdengine.auth.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "tdengine") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "tdengine") | nindent 4 }}
type: Opaque
stringData:
  TAOS_USER: {{ required "tdengine.auth.username is required" .Values.tdengine.auth.username | quote }}
  TAOS_PASSWORD: {{ required "tdengine.auth.password is required" .Values.tdengine.auth.password | quote }}
  TAOS_DATABASE: {{ required "tdengine.auth.database is required" .Values.tdengine.auth.database | quote }}
---
{{- end }}
{{- if and (or .Values.backend.enabled .Values.mcpServer.enabled) (not .Values.backend.existingConfigSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "backend-config") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  helm.yml: |
    env: {{ .Values.global.environment }}
    http:
      host: 0.0.0.0
      port: {{ .Values.backend.service.port }}
    security:
      device_credentials_key: {{ required "backend.config.deviceCredentialsKey is required" .Values.backend.config.deviceCredentialsKey | quote }}
      api_sign:
        app_key: {{ required "backend.config.apiSign.appKey is required" .Values.backend.config.apiSign.appKey | quote }}
        app_security: {{ required "backend.config.apiSign.appSecret is required" .Values.backend.config.apiSign.appSecret | quote }}
      logto:
        issuer: {{ printf "%s/oidc" (trimSuffix "/" .Values.global.publicUrls.logto) | quote }}
        audience: {{ .Values.global.publicUrls.backend | quote }}
        jwks_url: {{ printf "http://%s:%d/oidc/jwks" (include "0things.componentName" (dict "root" . "component" "logto")) (int .Values.logto.service.appPort) | quote }}
        organization_claim: {{ .Values.backend.config.logto.organizationClaim | quote }}
        management:
          endpoint: {{ printf "http://%s:%d" (include "0things.componentName" (dict "root" . "component" "logto")) (int .Values.logto.service.appPort) | quote }}
          app_id: {{ required "backend.config.logto.managementAppId is required" .Values.backend.config.logto.managementAppId | quote }}
          app_secret: {{ required "backend.config.logto.managementAppSecret is required" .Values.backend.config.logto.managementAppSecret | quote }}
          resource: {{ .Values.backend.config.logto.managementResource | quote }}
    data:
      db:
        aiot:
          driver: postgres
          dsn: {{ printf "host=%s port=%d user=%s password=%s dbname=%s sslmode=disable" (include "0things.componentName" (dict "root" . "component" "postgres")) (int .Values.postgres.service.port) .Values.postgres.auth.username .Values.postgres.auth.password .Values.postgres.auth.database | quote }}
      storage:
        r2:
          endpoint: {{ .Values.backend.config.r2.endpoint | quote }}
          bucket: {{ .Values.backend.config.r2.bucket | quote }}
          region: {{ .Values.backend.config.r2.region | quote }}
          access_key_id: {{ .Values.backend.config.r2.accessKeyId | quote }}
          secret_access_key: {{ .Values.backend.config.r2.secretAccessKey | quote }}
          public_base_url: {{ .Values.backend.config.r2.publicBaseUrl | quote }}
          prefix: {{ .Values.backend.config.r2.prefix | quote }}
      redis:
        addr: {{ printf "%s:%d" (include "0things.componentName" (dict "root" . "component" "redis")) (int .Values.redis.service.port) | quote }}
        password: {{ .Values.redis.auth.password | quote }}
        db: 0
        read_timeout: 2s
        write_timeout: 2s
      mqtt:
        broker: {{ printf "tcp://%s:%d" (include "0things.componentName" (dict "root" . "component" "emqx")) (int .Values.emqx.service.mqttPort) | quote }}
        client_id: {{ .Values.backend.config.mqtt.clientId | quote }}
        username: {{ .Values.backend.config.mqtt.username | quote }}
        password: {{ .Values.backend.config.mqtt.password | quote }}
    tsdb:
      type: tdengine
      tdengine:
        dsn: {{ printf "%s:%s@ws(%s:%d)/" .Values.tdengine.auth.username .Values.tdengine.auth.password (include "0things.componentName" (dict "root" . "component" "tdengine")) (int .Values.tdengine.service.websocketPort) | quote }}
        database: {{ .Values.tdengine.auth.database | quote }}
        table: device_properties
    event:
      driver: nats
      nats:
        url: {{ if .Values.nats.auth.enabled }}{{ printf "nats://%s:%s@%s:%d" .Values.nats.auth.username .Values.nats.auth.password (include "0things.componentName" (dict "root" . "component" "nats")) (int .Values.nats.service.clientPort) | quote }}{{ else }}{{ printf "nats://%s:%d" (include "0things.componentName" (dict "root" . "component" "nats")) (int .Values.nats.service.clientPort) | quote }}{{ end }}
    device_gateway:
      mqtt:
        host: {{ .Values.backend.config.deviceGateway.mqttHost | quote }}
        port: {{ .Values.backend.config.deviceGateway.mqttPort | quote }}
    mcp:
      name: 0things-iot-mcp
      version: 0.1.0
      stdio_enabled: false
      sse_enabled: false
      sse_addr: ":8008"
      streamable_http_enabled: true
      streamable_http_addr: {{ printf ":%d" (int .Values.mcpServer.service.port) | quote }}
    log:
      log_level: {{ ternary "debug" "info" (ne .Values.global.environment "prod") }}
      mode: console
      output: stderr
      encoding: console
      max_backups: 30
      max_age: 7
      max_size: 1024
      compress: true
---
{{- end }}
{{- if and .Values.dataEngine.enabled (not .Values.dataEngine.existingConfigSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "data-engine-config") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "data-engine") | nindent 4 }}
type: Opaque
stringData:
  helm.yml: |
    env: {{ .Values.global.environment }}
    data:
      db:
        aiot:
          driver: postgres
          dsn: {{ printf "host=%s port=%d user=%s password=%s dbname=%s sslmode=disable" (include "0things.componentName" (dict "root" . "component" "postgres")) (int .Values.postgres.service.port) .Values.postgres.auth.username .Values.postgres.auth.password .Values.postgres.auth.database | quote }}
    tsdb:
      type: tdengine
      tdengine:
        dsn: {{ printf "%s:%s@ws(%s:%d)/" .Values.tdengine.auth.username .Values.tdengine.auth.password (include "0things.componentName" (dict "root" . "component" "tdengine")) (int .Values.tdengine.service.websocketPort) | quote }}
        database: {{ .Values.tdengine.auth.database | quote }}
        table: device_properties
    redis:
      addr: {{ printf "%s:%d" (include "0things.componentName" (dict "root" . "component" "redis")) (int .Values.redis.service.port) | quote }}
      password: {{ .Values.redis.auth.password | quote }}
      db: 0
    mqtt:
      broker: {{ printf "tcp://%s:%d" (include "0things.componentName" (dict "root" . "component" "emqx")) (int .Values.emqx.service.mqttPort) | quote }}
      client_id: {{ .Values.dataEngine.config.mqttClientId | quote }}
      username: {{ .Values.dataEngine.config.mqttUsername | quote }}
      password: {{ .Values.dataEngine.config.mqttPassword | quote }}
    event:
      driver: nats
      nats:
        url: {{ if .Values.nats.auth.enabled }}{{ printf "nats://%s:%s@%s:%d" .Values.nats.auth.username .Values.nats.auth.password (include "0things.componentName" (dict "root" . "component" "nats")) (int .Values.nats.service.clientPort) | quote }}{{ else }}{{ printf "nats://%s:%d" (include "0things.componentName" (dict "root" . "component" "nats")) (int .Values.nats.service.clientPort) | quote }}{{ end }}
    log:
      log_level: {{ ternary "debug" "info" (ne .Values.global.environment "prod") }}
      mode: console
      encoding: console
---
{{- end }}
{{- if and .Values.transportHttp.enabled (not .Values.transportHttp.existingConfigSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "transport-http-config") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "transport-http") | nindent 4 }}
type: Opaque
