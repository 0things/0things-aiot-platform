    log:
      log_level: {{ ternary "debug" "info" (ne .Values.global.environment "prod") }}
      mode: console
      encoding: console
---
{{- end }}
{{- if and .Values.transportMqtt.enabled (not .Values.transportMqtt.existingConfigSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "transport-mqtt-config") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "transport-mqtt") | nindent 4 }}
type: Opaque
stringData:
  helm.yml: |
    env: {{ .Values.global.environment }}
    mqtt:
      broker: {{ printf "tcp://%s:%d" (include "0things.componentName" (dict "root" . "component" "emqx")) (int .Values.emqx.service.mqttPort) | quote }}
      client_id: {{ .Values.transportMqtt.config.clientId | quote }}
      username: {{ .Values.transportMqtt.config.username | quote }}
      password: {{ .Values.transportMqtt.config.password | quote }}
