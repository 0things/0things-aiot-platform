{{- if and .Values.logto.enabled (not .Values.logto.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "logto") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "logto") | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ printf "postgres://%s:%s@%s:%d/%s" (.Values.logtoPostgres.auth.username | urlquery) (.Values.logtoPostgres.auth.password | urlquery) (include "0things.componentName" (dict "root" . "component" "logto-postgres")) (int .Values.logtoPostgres.service.port) (.Values.logtoPostgres.auth.database | urlquery) | quote }}
