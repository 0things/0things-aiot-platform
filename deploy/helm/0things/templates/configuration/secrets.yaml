metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "ai-copilot") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "ai-copilot") | nindent 4 }}
type: Opaque
stringData:
  AI_MODEL_BASE_URL: {{ required "aiCopilot.config.modelBaseUrl is required" .Values.aiCopilot.config.modelBaseUrl | quote }}
  AI_MODEL_API_KEY: {{ required "aiCopilot.config.modelApiKey is required" .Values.aiCopilot.config.modelApiKey | quote }}
  AI_MODEL_ID: {{ required "aiCopilot.config.modelId is required" .Values.aiCopilot.config.modelId | quote }}
