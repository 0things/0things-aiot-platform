{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "frontend") | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      gzip on;
      gzip_min_length 1k;
      gzip_comp_level 6;
      gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/svg+xml;
      gzip_vary on;

      location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
      }
      {{- if .Values.backend.enabled }}

      location /api/ {
        proxy_pass http://{{ include "0things.componentName" (dict "root" . "component" "backend") }}:{{ .Values.backend.service.port }}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /swagger/ {
        proxy_pass http://{{ include "0things.componentName" (dict "root" . "component" "backend") }}:{{ .Values.backend.service.port }}/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
      {{- end }}
      {{- if .Values.aiCopilot.enabled }}

      location /copilot/ {
        proxy_pass http://{{ include "0things.componentName" (dict "root" . "component" "ai-copilot") }}:{{ .Values.aiCopilot.service.port }}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
      {{- end }}
      {{- if .Values.mcpServer.enabled }}

      location /mcp {
        proxy_pass http://{{ include "0things.componentName" (dict "root" . "component" "mcp-server") }}:{{ .Values.mcpServer.service.port }}/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
      {{- end }}
    }
{{- end }}
