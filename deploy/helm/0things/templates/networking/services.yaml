{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "0things.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
---
{{- end }}
