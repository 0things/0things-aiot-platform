{{- if and .Values.ingress.enabled .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "0things.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "0things.labels" (dict "root" . "component" "frontend") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.frontend.tlsSecret }}
  tls:
    - secretName: {{ .Values.ingress.frontend.tlsSecret }}
      {{- with .Values.ingress.frontend.host }}
      hosts:
        - {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.frontend.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.frontend.path }}
            pathType: {{ .Values.ingress.frontend.pathType }}
            backend:
              service:
                name: {{ include "0things.componentName" (dict "root" . "component" "frontend") }}
                port:
                  name: http
---
{{- end }}
