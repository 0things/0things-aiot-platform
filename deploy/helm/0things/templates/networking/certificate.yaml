{{- if .Values.certificate }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.name }}
spec:
  secretName: aiot-platform-tls
  issuerRef:
    name: {{ required "certificate.issuerName is required" .Values.certificate.issuerName }}
    kind: ClusterIssuer
  dnsNames:
    {{- toYaml .Values.certificate.dnsNames | nindent 4 }}
{{- end }}
