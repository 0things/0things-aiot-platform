schema: spec-driven

context: |
  Repository: monorepo at repo root with two independently deployable parts.

  aiot-backend/ — Go HTTP service.
    - gin router, gorm ORM; DAL generated by gormgen under internal/dal/query
    - google/wire DI (cmd/server/wire/wire_gen.go)
    - Swagger docs generated by swag under docs/
    - Layering: internal/handler (HTTP) → internal/service (biz) → internal/repository (data) → internal/model (gorm structs); api/*/v1 for DTOs
    - Makefile for build/test; use conventional commits

  aiot-frontend/ — Vite + React + TypeScript admin UI (pnpm).
    - shadcn/ui + Lucide icons; TanStack Query v5 for data fetching; TanStack Table for tables
    - i18n via react-i18next, locale files in public/locales/{zh,en}/ (maintain BOTH languages)
    - API client auto-generated into src/api/generated/ — regenerate from OpenAPI, do NOT hand-edit
    - Feature code under src/features/, shared components under src/components/, API wrappers under each feature's api/
    - Conventions: 2-space indent, single quotes, no semicolons; components PascalCase; custom hooks use-*.ts; feature dirs kebab-case

  This repo already has an AGENTS.md with full build/lint/test/contribution guidelines — follow it.

  Domain: AIoT platform — device management, OTA firmware upgrades, products / thing-model, message parsing, events & operations monitoring, auth.
  除了技术名词外，对话使用中文
